<!doctype html>
<html lang="es-PE" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="description" content="Reporta fallas de internet, señal o llamadas y sigue su atención en línea. Portal ciudadano y centro de operaciones de Red TeleCorp Sentinel AI." />
    <meta name="application-name" content="Red TeleCorp Sentinel AI" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:site_name" content="Red TeleCorp Sentinel AI" />
    <meta property="og:title" content="Reporta un problema con tu servicio · Red TeleCorp" />
    <meta property="og:description" content="Reporta fallas de tu servicio en menos de 2 minutos y sigue su atención en tiempo real." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <title>Red TeleCorp Sentinel AI</title>
    <script>
      // Evita el destello oscuro al cargar el portal (rutas fuera de #/noc usan tema claro)
      if (!location.hash.startsWith("#/noc")) {
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("theme-light");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Esta aplicación necesita JavaScript habilitado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
